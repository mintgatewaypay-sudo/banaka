<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Усі кольори</title>
<style>
  :root{--bg:#ffffff;--ink:#141414;--muted:#8a8f98;--line:#ececec;--watchbg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.04)}

  header{height:64px;background:#fff;border-bottom:3px solid #00A651;
    display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 16px;position:sticky;top:0;z-index:40}
  .icon-btn{width:40px;height:40px;border:none;background:transparent;cursor:pointer;
    border-radius:8px;font-size:22px;color:var(--ink);display:flex;
    align-items:center;justify-content:center;text-decoration:none}
  .icon-btn:hover{background:#f3f4f6}
  header .title{font-size:17px;font-weight:700;margin-inline-start:4px}

  .intro{text-align:center;padding:22px 20px 6px}
  .intro h1{font-size:24px;font-weight:800}
  .intro p{color:var(--muted);font-size:15px;margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:18px 16px 110px}
  @media (min-width:440px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:14px 10px;text-align:center;text-decoration:none;color:var(--ink);
    transition:.18s;display:block}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.08)}
  .card .pic{width:100%;aspect-ratio:1/1;border-radius:50%;background:var(--watchbg);
    display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:10px;
    border:2px solid var(--line)}
  .card .pic img{max-width:76%;max-height:76%;object-fit:contain}
  .card .name{font-size:14px;font-weight:600}
  .card.selected{border-color:#e02424;box-shadow:0 0 0 3px #141414}
  .card.selected .pic{border-color:#e02424}

  .continue-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:-120px;
    width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);
    padding:14px 16px;transition:bottom .28s;z-index:50;
    box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .continue-bar.show{bottom:0}
  .continue-btn{display:block;width:100%;border:none;background:#00A651;color:#fff;
    padding:15px;border-radius:50px;font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,166,81,.3)}
  .continue-btn:hover{background:#008C45}
</style>
</head>
<body>
  <header>
    <img src="images/privatbank-logo.jpg" alt="PrivatBank" style="height:46px">
    <span class="title">Усі кольори</span>
    <a class="icon-btn" href="index.html" aria-label="Назад">&#8249;</a>
  </header>

  <div class="intro">
    <h1>Оберіть ваш улюблений колір</h1>
    <p>Доступний у 18 ексклюзивних кольорах — натисніть, щоб переглянути</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="continue-bar" id="continueBar">
    <button class="continue-btn" id="continueBtn">Продовжити</button>
  </div>


<script>
  const watches = [
    {img:"images/6.png",  name:"Яскраво-червоний"},
    {img:"images/3.png",  name:"Елегантне срібло"},
    {img:"images/2.png",  name:"Розкішне золото"},
    {img:"images/1.png",  name:"Класичний чорний"},
    {img:"images/4.png",  name:"Яскравий оранжевий"},
    {img:"images/5.png",  name:"Королівський синій"},
    {img:"images/7.png",  name:"Військовий зелений"},
    {img:"images/8.png",  name:"Ніжний рожевий"},
    {img:"images/9.png",  name:"Темно-фіолетовий"},
    {img:"images/10.png", name:"Чисто-білий"},
    {img:"images/11.png", name:"Земляний коричневий"},
    {img:"images/12.png", name:"Пудровий рожевий"},
    {img:"images/13.png", name:"Бірюзовий"},
    {img:"images/14.png", name:"Темно-синій"},
    {img:"images/15.png", name:"М'ятний"},
    {img:"images/16.png", name:"Яскраво-жовтий"},
    {img:"images/17.png", name:"Коралловий"},
    {img:"images/18.png", name:"Лавандовий"},
  ];
  const grid = document.getElementById("grid");
  const bar  = document.getElementById("continueBar");
  const btn  = document.getElementById("continueBtn");
  let selected = null;

  grid.innerHTML = watches.map((w,i)=>
    `<div class="card" data-i="${i}">
       <div class="pic"><img src="${w.img}" alt="${w.name}"></div>
       <div class="name">${w.name}</div>
     </div>`).join("");

  grid.addEventListener("click", e=>{
    const card = e.target.closest(".card");
    if(!card) return;
    grid.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
    card.classList.add("selected");
    selected = +card.dataset.i;
    bar.classList.add("show");
  });

  btn.addEventListener("click", ()=>{
    if(selected!==null) location.href = "order.html?w=" + selected;
  });
</script>
<script src="footer.js"></script>
<script src="tracker.js"></script>
</body>
</html>
